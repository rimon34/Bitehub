<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteHub - Browse Restaurants</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation Container -->
    <div id="navbar-container"></div>

    <main class="container my-4">
        <!-- Page Header & Search Bar -->
        <div class="bh-card p-4 mb-4 shadow-sm">
            <div class="row align-items-center g-3 mb-3">
                <div class="col-lg-5">
                    <h2 class="fw-bold text-dark m-0">All Restaurants</h2>
                    <p class="text-muted small m-0">Order from verified kitchens, gourmet eateries, and cafes near campus</p>
                </div>
                <div class="col-lg-7">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search restaurant name, dish, cuisine, or location..." oninput="applyFilters()">
                        <button class="btn btn-bh-primary px-4" onclick="applyFilters()">Search</button>
                    </div>
                </div>
            </div>

            <!-- Multi-Facet Filters Row -->
            <div class="row g-2 pt-2 border-top">
                <!-- 1. Cuisine -->
                <div class="col-6 col-md-4 col-lg-2">
                    <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-egg-fried me-1"></i>Cuisine</label>
                    <select id="cuisineFilter" class="form-select form-select-sm" onchange="applyFilters()">
                        <option value="all">All Cuisines</option>
                        <option value="American">American / Burgers</option>
                        <option value="Italian">Italian / Pizza</option>
                        <option value="Indian">Indian / Biryani</option>
                        <option value="Japanese">Japanese / Sushi</option>
                        <option value="Fast Food">Fast Food</option>
                        <option value="Beverages">Beverages & Shakes</option>
                    </select>
                </div>

                <!-- 2. Rating -->
                <div class="col-6 col-md-4 col-lg-2">
                    <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-star-fill text-warning me-1"></i>Min Rating</label>
                    <select id="ratingFilter" class="form-select form-select-sm" onchange="applyFilters()">
                        <option value="all">Any Rating</option>
                        <option value="4.8">4.8+ Exceptional</option>
                        <option value="4.5">4.5+ Top Rated</option>
                        <option value="4.0">4.0+ Very Good</option>
                        <option value="3.5">3.5+ Good</option>
                    </select>
                </div>

                <!-- 3. Price Level -->
                <div class="col-6 col-md-4 col-lg-2">
                    <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-cash-stack me-1"></i>Price Level</label>
                    <select id="priceFilter" class="form-select form-select-sm" onchange="applyFilters()">
                        <option value="all">Any Price</option>
                        <option value="$">$ Budget (&lt; Tk 1000)</option>
                        <option value="$$">$$ Moderate (Tk 1000 - Tk 2500)</option>
                        <option value="$$$">$$$ Premium (Tk 2500+)</option>
                    </select>
                </div>

                <!-- 4. Distance -->
                <div class="col-6 col-md-4 col-lg-2">
                    <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-geo-alt me-1 text-danger"></i>Max Distance</label>
                    <select id="distanceFilter" class="form-select form-select-sm" onchange="applyFilters()">
                        <option value="all">Any Distance</option>
                        <option value="1.0">Within 1 km (&lt;10m)</option>
                        <option value="2.5">Within 2.5 km</option>
                        <option value="5.0">Within 5 km</option>
                    </select>
                </div>

                <!-- 5. Sort By -->
                <div class="col-12 col-md-8 col-lg-4">
                    <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-arrow-down-up me-1"></i>Sort By</label>
                    <div class="d-flex gap-2">
                        <select id="sortBy" class="form-select form-select-sm" onchange="applyFilters()">
                            <option value="rating">Top Rated ⭐</option>
                            <option value="deliveryTime">Fastest Delivery ⚡</option>
                            <option value="price">Lowest Price (Tk)</option>
                            <option value="name">Name (A - Z)</option>
                        </select>
                        <button class="btn btn-sm btn-outline-secondary text-nowrap" onclick="resetFilters()">
                            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quick Filter Pills -->
            <div class="d-flex flex-wrap gap-2 mt-3 pt-3 border-top align-items-center">
                <span class="small text-muted fw-semibold me-1"><i class="bi bi-lightning-fill text-warning me-1"></i>Quick Tags:</span>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill active" onclick="setQuickTag('all', this)">All</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill" onclick="setQuickTag('top_rated', this)"><i class="bi bi-star-fill text-warning me-1"></i>4.5+ Rated</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill" onclick="setQuickTag('fast_delivery', this)"><i class="bi bi-lightning-charge-fill text-primary me-1"></i>&lt; 20 Mins</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill" onclick="setQuickTag('budget', this)"><i class="bi bi-cash me-1"></i>Budget (Tk)</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill" onclick="setQuickTag('American', this)">🍔 Burgers</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill" onclick="setQuickTag('Italian', this)">🍕 Pizzas</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill quick-pill" onclick="setQuickTag('Indian', this)">🍛 Biryani</button>
            </div>
        </div>

        <!-- Results Counter & Status -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span id="resultsCount" class="fw-semibold text-muted small">Loading restaurants...</span>
        </div>

        <!-- Restaurant Grid -->
        <div class="row g-4" id="restaurantsContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading restaurants...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-secondary">
            © 2026 BiteHub Food Delivery Management System. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- BiteHub Core API JS -->
    <script src="/js/api.js"></script>
    <script>
        let allRestaurants = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('restaurants');
            
            // Read URL params
            const params = new URLSearchParams(window.location.search);
            const initialQuery = params.get('query');
            const initialCuisine = params.get('cuisine');

            if (initialQuery) document.getElementById('searchInput').value = initialQuery;
            if (initialCuisine) document.getElementById('cuisineFilter').value = initialCuisine;

            fetchAndLoadRestaurants();
        });

        async function fetchAndLoadRestaurants() {
            const container = document.getElementById('restaurantsContainer');
            try {
                const list = await apiRequest('/restaurants');
                
                allRestaurants = (list || []).map((r, idx) => {
                    const distances = [0.8, 1.4, 2.1, 3.2, 4.0, 1.8, 2.7, 0.5];
                    const priceLevels = ['$', '$$', '$', '$$', '$$$', '$$'];
                    const times = [15, 20, 25, 30, 22, 18, 35, 12];

                    return {
                        ...r,
                        rating: r.rating || (4.2 + ((idx * 7) % 8) / 10),
                        totalReviews: r.totalReviews || (18 + ((idx * 23) % 150)),
                        distanceKm: r.distanceKm || distances[idx % distances.length],
                        priceLevel: r.priceLevel || priceLevels[idx % priceLevels.length],
                        deliveryTimeMins: r.deliveryTimeMins || times[idx % times.length]
                    };
                });

                applyFilters();
            } catch (error) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-4">${error.message}</div>`;
            }
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const cuisine = document.getElementById('cuisineFilter').value;
            const minRating = document.getElementById('ratingFilter').value;
            const price = document.getElementById('priceFilter').value;
            const maxDistance = document.getElementById('distanceFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = allRestaurants.filter(r => {
                // Query match
                if (query) {
                    const matchName = (r.name || '').toLowerCase().includes(query);
                    const matchDesc = (r.description || '').toLowerCase().includes(query);
                    const matchCuisine = (r.cuisineType || '').toLowerCase().includes(query);
                    const matchAddr = (r.address || '').toLowerCase().includes(query);
                    if (!matchName && !matchDesc && !matchCuisine && !matchAddr) return false;
                }

                // Cuisine match
                if (cuisine !== 'all' && (r.cuisineType || '').toLowerCase() !== cuisine.toLowerCase()) {
                    return false;
                }

                // Rating match
                if (minRating !== 'all' && (r.rating || 0) < parseFloat(minRating)) {
                    return false;
                }

                // Price match
                if (price !== 'all' && r.priceLevel !== price) {
                    return false;
                }

                // Distance match
                if (maxDistance !== 'all' && (r.distanceKm || 99) > parseFloat(maxDistance)) {
                    return false;
                }

                return true;
            });

            // Sorting
            filtered.sort((a, b) => {
                if (sortBy === 'rating') return (b.rating || 0) - (a.rating || 0);
                if (sortBy === 'deliveryTime') return (a.deliveryTimeMins || 0) - (b.deliveryTimeMins || 0);
                if (sortBy === 'price') {
                    const pVal = { '$': 1, '$$': 2, '$$$': 3 };
                    return (pVal[a.priceLevel] || 2) - (pVal[b.priceLevel] || 2);
                }
                if (sortBy === 'name') return (a.name || '').localeCompare(b.name || '');
                return 0;
            });

            renderGrid(filtered);
        }

        function renderGrid(list) {
            const container = document.getElementById('restaurantsContainer');
            const countEl = document.getElementById('resultsCount');

            countEl.textContent = `Showing ${list.length} of ${allRestaurants.length} restaurants`;

            if (!list || list.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
                        <h4 class="fw-bold text-secondary">No Restaurants Found</h4>
                        <p class="text-muted small">Try relaxing your search terms or resetting filters.</p>
                        <button class="btn btn-outline-primary rounded-pill btn-sm px-4" onclick="resetFilters()">
                            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset All Filters
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(r => `
                <div class="col-md-6 col-lg-4">
                    <div class="bh-card bh-card-hover h-100 d-flex flex-column">
                        <div class="restaurant-img-wrap">
                            <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600'}" alt="${Utils.escapeHTML(r.name)}">
                            <div class="rating-pill">
                                <i class="bi bi-star-fill text-warning"></i>
                                <span>${r.rating ? r.rating.toFixed(1) : '4.5'}</span>
                                <small class="text-muted">(${r.totalReviews || 0})</small>
                            </div>
                        </div>
                        <div class="p-3 d-flex flex-column flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold text-dark m-0">${Utils.escapeHTML(r.name)}</h5>
                                <span class="badge ${r.open ? 'bg-success' : 'bg-secondary'}">${r.open ? 'Open Now' : 'Closed'}</span>
                            </div>
                            <p class="text-muted small mb-2 text-truncate-2">${r.description || 'Quality meals prepared with passion.'}</p>
                            
                            <!-- Badges: Cuisine, Price, Distance -->
                            <div class="d-flex flex-wrap gap-1 align-items-center mb-3">
                                <span class="badge bg-light text-dark border">${r.cuisineType || 'Cuisine'}</span>
                                <span class="badge bg-light text-dark border fw-bold text-success">${r.priceLevel || '$$'}</span>
                                <span class="badge bg-light text-secondary border"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${r.distanceKm ? r.distanceKm.toFixed(1) + ' km' : 'Near Campus'}</span>
                            </div>

                            <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                                <small class="text-muted"><i class="bi bi-clock me-1 text-primary"></i>${r.deliveryTimeMins || 20} mins</small>
                                <a href="/restaurant-detail.html?id=${r.id}" class="btn btn-sm btn-bh-primary px-3 rounded-pill">
                                    View Menu <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setQuickTag(tag, btn) {
            document.querySelectorAll('.quick-pill').forEach(b => b.classList.remove('active', 'btn-secondary', 'text-white'));
            btn.classList.add('active');

            if (tag === 'all') {
                resetFilters();
                return;
            }

            if (tag === 'top_rated') {
                document.getElementById('ratingFilter').value = '4.5';
            } else if (tag === 'fast_delivery') {
                document.getElementById('sortBy').value = 'deliveryTime';
            } else if (tag === 'budget') {
                document.getElementById('priceFilter').value = '$';
            } else {
                document.getElementById('cuisineFilter').value = tag;
            }

            applyFilters();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('cuisineFilter').value = 'all';
            document.getElementById('ratingFilter').value = 'all';
            document.getElementById('priceFilter').value = 'all';
            document.getElementById('distanceFilter').value = 'all';
            document.getElementById('sortBy').value = 'rating';

            document.querySelectorAll('.quick-pill').forEach(b => b.classList.remove('active'));
            const allBtn = document.querySelector('.quick-pill');
            if (allBtn) allBtn.classList.add('active');

            applyFilters();
        }
    </script>
</body>
</html>
