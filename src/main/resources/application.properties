# Server Port
server.port=8080

# Spring Application Name
spring.application.name=bitehub

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bitehub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari connection pool (SSE streams must never pin a connection, so open-in-view is off below)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=240000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
# Long-lived SSE requests must not hold a JDBC connection for their whole lifetime.
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Formatter
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# JWT Secret Configuration (256-bit key)
jwt.expiration-ms=86400000
orders.customer-cancellation-window-minutes=${CUSTOMER_CANCELLATION_WINDOW_MINUTES:10}

# File Upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Web & Static Resources
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/,file:target/classes/static/
spring.web.resources.cache.period=0

# Security Properties
jwt.secret=${JWT_SECRET}
admin.secret=${ADMIN_SECRET}

# Geocoding (keyless, OpenStreetMap-based: Photon or Nominatim)
# Addresses are resolved once and persisted on the restaurant / order.
bitehub.geocoding.enabled=${GEOCODE_ENABLED:true}
bitehub.geocoding.provider=${GEOCODE_PROVIDER:photon}
bitehub.geocoding.user-agent=${GEOCODE_USER_AGENT:BiteHub-Demo/1.0}
# Campus base point used to reject implausible (far-away) geocoding hits.
# Set to a large value (or 0 to disable) for production deployments outside the demo campus.
bitehub.geocoding.base-latitude=${GEOCODE_BASE_LAT:23.7937}
bitehub.geocoding.base-longitude=${GEOCODE_BASE_LNG:90.4066}
bitehub.geocoding.max-distance-km=${GEOCODE_MAX_DISTANCE_KM:50}
